<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<title>Muhammad Khalid Brahmana (Copy)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Special+Elite&display=swap" rel="stylesheet">
<style id="page-style">
  /* Layout: poster akademik — hero gelap dengan kisi bintang delapan, lalu enam bab bernomor bergantian gelap dan kertas. */
  :root {
    --ink: #0f0d0b;
    --ink-2: #1a1612;
    --ink-3: #241e18;
    --paper: #efe6d2;
    --paper-dim: #b9ad95;
    --paper-ink: #5a5144;
    --merah: #c8102e;
    --merah-hi: #e43b4f;
    --rule: rgba(239,230,210,.16);
    --rule-dark: rgba(15,13,11,.16);
    --f-display: "Big Shoulders Display", Impact, "Arial Narrow", sans-serif;
    --f-body: "Source Serif 4", Georgia, "Times New Roman", serif;
    --f-type: "Special Elite", "Courier New", Courier, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--ink); color: var(--paper); font: 18px/1.65 var(--f-body); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--ink); }
  a { color: inherit; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--merah-hi); outline-offset: 3px; }
  .wrap {
    max-width: 1120px; margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(15,13,11,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--rule); }
  nav .wrap { display: flex; align-items: center; justify-content: space-between; height: 60px; gap: 16px; }
  .brand { font: 800 21px/1 var(--f-display); letter-spacing: .08em; text-transform: uppercase; text-decoration: none; white-space: nowrap; }
  .brand b { color: var(--merah-hi); font-weight: 800; }
  .nav-links { display: flex; gap: 22px; }
  .nav-links a { font: 600 14px var(--f-display); letter-spacing: .14em; text-transform: uppercase; text-decoration: none; color: var(--paper-dim); }
  .nav-links a:hover { color: var(--paper); }
  @media (max-width: 900px) { .nav-links { display: none; } }

  .music {
    position: fixed; z-index: 25;
    right: max(18px, calc(env(safe-area-inset-right, 0px) + 18px));
    bottom: max(18px, calc(env(safe-area-inset-bottom, 0px) + 18px));
    display: flex; align-items: center; gap: 10px;
    background: var(--paper); color: var(--ink); border: 0; border-radius: 999px;
    padding: 10px 16px 10px 12px; cursor: pointer; font: 700 14px var(--f-display); letter-spacing: .12em; text-transform: uppercase;
    box-shadow: 0 6px 24px rgba(0,0,0,.45);
  }
  .eq { display: flex; align-items: flex-end; gap: 3px; height: 18px; width: 22px; }
  .eq i { display: block; width: 4px; height: 30%; background: var(--merah); border-radius: 1px; }
  .music.on .eq i { animation: eq .9s ease-in-out infinite; }
  .music.on .eq i:nth-child(2) { animation-delay: -.3s; }
  .music.on .eq i:nth-child(3) { animation-delay: -.6s; }
  .music.on .eq i:nth-child(4) { animation-delay: -.15s; }
  @keyframes eq { 0%,100% { height: 25%; } 50% { height: 100%; } }

  .music-hint {
    position: fixed; z-index: 25;
    right: max(18px, calc(env(safe-area-inset-right, 0px) + 18px));
    bottom: max(70px, calc(env(safe-area-inset-bottom, 0px) + 70px));
    background: var(--merah); color: #fff; padding: 7px 12px; font: 600 13px var(--f-display); letter-spacing: .1em; text-transform: uppercase;
    box-shadow: 0 6px 24px rgba(0,0,0,.45); animation: nudge 1.6s ease-in-out infinite; pointer-events: none;
  }
  @keyframes nudge { 50% { transform: translateY(-4px); } }
  .owner-bar {
    position: fixed; z-index: 25;
    left: max(18px, calc(env(safe-area-inset-left, 0px) + 18px));
    bottom: max(18px, calc(env(safe-area-inset-bottom, 0px) + 18px));
    background: var(--merah); color: #fff; padding: 8px 14px; font: 700 13px var(--f-display); letter-spacing: .14em; text-transform: uppercase;
    box-shadow: 0 6px 24px rgba(0,0,0,.45);
  }
  .toast {
    position: fixed; z-index: 40; left: 50%; transform: translateX(-50%);
    bottom: max(80px, calc(env(safe-area-inset-bottom, 0px) + 80px));
    background: var(--paper); color: var(--ink); padding: 10px 18px; font-size: 15px; max-width: calc(100% - 32px);
    box-shadow: 0 6px 24px rgba(0,0,0,.45);
  }

  /* Hero */
  .hero { position: relative; overflow: hidden; padding-block: 96px 80px; border-bottom: 1px solid var(--rule); }
  #stars {
    position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none;
    -webkit-mask-image: radial-gradient(ellipse at 75% 45%, #000 0%, rgba(0,0,0,.6) 45%, transparent 80%);
            mask-image: radial-gradient(ellipse at 75% 45%, #000 0%, rgba(0,0,0,.6) 45%, transparent 80%);
  }
  .hero-inner { position: relative; z-index: 1; }
  .hero-photo {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 35% 35%;
    animation: kenburns 32s ease-in-out infinite alternate; transform-origin: 40% 40%;
  }
  @keyframes kenburns { from { transform: scale(1); } to { transform: scale(1.08) translate(-1%, -1%); } }
  .hero-shade {
    position: absolute; inset: 0;
    background:
      linear-gradient(90deg, rgba(15,13,11,.94) 0%, rgba(15,13,11,.82) 38%, rgba(15,13,11,.55) 70%, rgba(15,13,11,.45) 100%),
      linear-gradient(0deg, var(--ink) 0%, rgba(15,13,11,0) 30%);
  }
  #stars { opacity: .6; }
  @media (max-width: 860px) {
    .hero-photo { object-position: 30% 30%; }
    .hero-shade { background: linear-gradient(180deg, rgba(15,13,11,.78) 0%, rgba(15,13,11,.9) 55%, var(--ink) 100%); }
  }
  .hero-grid { display: grid; grid-template-columns: 1.3fr .7fr; gap: 48px; align-items: end; }
  .hero-grid > * { min-width: 0; }
  .portrait { margin: 0; position: relative; width: 100%; max-width: 290px; justify-self: end; animation: rise 1.1s .35s cubic-bezier(.2,.8,.2,1) both; }
  .arch {
    position: relative; aspect-ratio: 4 / 5; max-width: 100%; overflow: hidden;
    border-radius: 999px 999px 0 0; background: var(--paper);
    box-shadow: 0 0 0 7px var(--ink), 0 0 0 9px var(--merah);
    background-image: radial-gradient(circle at 50% 38%, #fff8e8 0%, var(--paper) 55%, var(--paper-dim) 130%);
  }
  .arch img { position: absolute; left: 50%; bottom: 0; width: 100%; height: auto; transform: translateX(-50%); display: block; }
  .portrait figcaption { margin-top: 14px; font: 600 12px var(--f-display); letter-spacing: .22em; text-transform: uppercase; color: var(--paper-dim); }
  @media (max-width: 860px) {
    .hero-grid { grid-template-columns: 1fr; gap: 40px; }
    .portrait { max-width: 250px; margin-left: 14px; justify-self: start; }
  }
  .dateline { font: 600 15px var(--f-display); letter-spacing: .26em; text-transform: uppercase; color: var(--paper-dim); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .dateline::before { content: ""; width: 28px; height: 2px; background: var(--merah); }
  h1 .line1 { white-space: nowrap; }
  h1 { font: 900 clamp(44px, 6.6vw, 98px)/.9 var(--f-display); text-transform: uppercase; letter-spacing: .01em; margin: 22px 0 22px; text-wrap: balance; }
  h1 .w { display: inline-block; animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
  h1 .w:nth-child(2) { animation-delay: .12s; }
  h1 .w:nth-child(3) { animation-delay: .24s; }
  @keyframes rise { from { transform: translateY(.35em); opacity: .15; } to { transform: none; opacity: 1; } }
  .typer { font: 400 clamp(20px, 2.6vw, 28px)/1.3 var(--f-type); margin: 0 0 16px; min-height: 1.3em; }
  .typer b { font-weight: 400; color: var(--merah-hi); }
  .typer .caret { display: inline-block; width: .55em; border-bottom: 3px solid var(--merah-hi); margin-left: 2px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .tagline { font-size: clamp(18px, 2.1vw, 22px); max-width: 38em; color: var(--paper); margin: 0 0 30px; }
  .tagline em { color: var(--paper-dim); }
  .cta { display: flex; gap: 12px; flex-wrap: wrap; }
  .btn {
    font: 700 16px var(--f-display); letter-spacing: .16em; text-transform: uppercase; text-decoration: none;
    padding: 14px 24px; border: 1px solid var(--paper); background: transparent; color: var(--paper); cursor: pointer; display: inline-block;
  }
  .btn:hover { background: var(--paper); color: var(--ink); }
  .btn.red { background: var(--merah); border-color: var(--merah); color: #fff; }
  .btn.red:hover { background: var(--merah-hi); border-color: var(--merah-hi); color: #fff; }
  .sec-light .btn { border-color: var(--ink); color: var(--ink); }
  .sec-light .btn:hover { background: var(--ink); color: var(--paper); }

  .stats { display: grid; grid-template-columns: repeat(5, 1fr); border-bottom: 1px solid var(--rule); }
  .stat { padding: 26px 20px; border-left: 1px solid var(--rule); }
  .stat:first-child { border-left: 0; }
  .stat .n { font: 900 54px/1 var(--f-display); font-variant-numeric: tabular-nums; }
  .stat .l { font-size: 15px; color: var(--paper-dim); margin-top: 6px; }
  @media (max-width: 900px) { .stats { grid-template-columns: repeat(2, 1fr); } .stat:nth-child(odd) { border-left: 0; } .stat:nth-child(n+3) { border-top: 1px solid var(--rule); } .stat:last-child:nth-child(odd) { grid-column: 1 / -1; } }

  /* Bab */
  section { padding-block: 96px; }
  .sec-light { background: var(--paper); color: var(--ink); }
  .chapter { display: flex; align-items: baseline; gap: 16px; margin-bottom: 14px; }
  .chapter .no { font: 900 64px/1 var(--f-display); color: var(--merah); }
  .chapter .t { font: 600 14px var(--f-display); letter-spacing: .3em; text-transform: uppercase; color: var(--paper-dim); }
  .sec-light .chapter .t { color: var(--paper-ink); }
  h2 { font: 800 clamp(38px, 6vw, 72px)/.95 var(--f-display); text-transform: uppercase; margin: 0 0 18px; text-wrap: balance; }
  .lead { max-width: 40em; color: var(--paper-dim); margin: 0 0 40px; }
  .sec-light .lead { color: var(--paper-ink); }
  .sec-top { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; margin-bottom: 32px; }
  .sec-top .lead { margin: 0; }
  .add-btn {
    font: 700 14px var(--f-display); letter-spacing: .16em; text-transform: uppercase; cursor: pointer;
    background: var(--merah); color: #fff; border: 0; padding: 11px 18px;
  }
  .add-btn:hover { background: var(--merah-hi); }
  .empty { border: 1px dashed var(--rule); padding: 30px; text-align: center; color: var(--paper-dim); font-style: italic; margin: 0; }
  .sec-light .empty { border-color: rgba(15,13,11,.3); color: var(--paper-ink); }
  .del {
    font: 600 12px var(--f-display); letter-spacing: .14em; text-transform: uppercase; cursor: pointer;
    background: transparent; border: 1px solid currentColor; padding: 3px 10px; opacity: .7;
  }
  .del:hover, .del.armed { opacity: 1; }
  .del.armed { background: var(--merah); border-color: var(--merah); color: #fff; }

  /* 01 Profil */
  .about { display: grid; grid-template-columns: 1.1fr .9fr; gap: 56px; align-items: start; }
  .about > * { min-width: 0; }
  .about p { margin: 0 0 18px; max-width: 60ch; }
  .focus { display: grid; gap: 0; border-top: 2px solid var(--ink); }
  .focus div { display: flex; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--rule-dark); }
  .focus dt { font: 600 14px var(--f-display); letter-spacing: .18em; text-transform: uppercase; color: var(--paper-ink); }
  .focus dd { margin: 0; text-align: right; }
  .pull { font: 400 24px/1.5 var(--f-type); border-left: 4px solid var(--merah); padding: 4px 0 4px 20px; margin: 28px 0 0; }
  @media (max-width: 860px) { .about { grid-template-columns: 1fr; gap: 32px; } }

  /* 02 Portofolio */
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .card { position: relative; background: var(--ink-2); border: 1px solid var(--rule); transition: border-color .2s, transform .2s; }
  .card:hover { border-color: var(--merah); transform: translateY(-3px); }
  .card-open { display: flex; flex-direction: column; gap: 10px; width: 100%; height: 100%; text-align: left; background: none; border: 0; padding: 24px 22px 22px; cursor: pointer; min-height: 220px; }
  .meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 14px; color: var(--paper-dim); }
  .badge { font: 600 12px var(--f-display); letter-spacing: .18em; text-transform: uppercase; background: var(--merah); color: #fff; padding: 1px 8px; }
  .card h3 { font: 800 26px/1.05 var(--f-display); text-transform: uppercase; margin: 0; text-wrap: balance; }
  .card p { margin: 0; font-size: 16px; color: var(--paper-dim); }
  .card .more { margin-top: auto; font: 600 13px var(--f-display); letter-spacing: .2em; text-transform: uppercase; color: var(--paper-dim); }
  .card .del { position: absolute; top: 14px; right: 14px; color: var(--paper-dim); }
  @media (max-width: 980px) { .cards { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 560px) { .cards { grid-template-columns: 1fr; } .card-open { min-height: 0; } }

  /* 03 Aktivitas */
  .tl { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--ink); }
  .tl li { display: grid; grid-template-columns: 170px 1fr auto; gap: 24px; padding: 22px 0; border-bottom: 1px solid var(--rule-dark); align-items: start; }
  .tl li > * { min-width: 0; }
  .tl .yr { font: 900 34px/1 var(--f-display); color: var(--merah); font-variant-numeric: tabular-nums; }
  .tl h3 { font: 800 26px/1.1 var(--f-display); text-transform: uppercase; margin: 0 0 4px; }
  .tl .org { margin: 0; color: var(--paper-ink); font-style: italic; }
  .tl .desc { margin: 8px 0 0; max-width: 60ch; }
  .tl .del { color: var(--paper-ink); }
  .tl li.tl-group { display: block; border-bottom: 0; padding: 34px 0 6px; font: 800 15px var(--f-display); letter-spacing: .24em; text-transform: uppercase; color: var(--merah); }
  .tl li.tl-group:first-child { padding-top: 18px; }
  .sec-light .chip { color: var(--paper-ink); border-color: rgba(15,13,11,.25); }
  .sec-light .chip:hover { color: var(--ink); }
  .sec-light .chip.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  @media (max-width: 640px) { .tl li { grid-template-columns: 1fr auto; } .tl .yr { grid-column: 1 / -1; font-size: 28px; } }

  /* 04 Tulisan */
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
  .chip { font: 600 15px var(--f-display); letter-spacing: .14em; text-transform: uppercase; color: var(--paper-dim); background: transparent; border: 1px solid var(--rule); padding: 6px 14px; cursor: pointer; }
  .chip:hover { color: var(--paper); }
  .chip.on { background: var(--paper); color: var(--ink); border-color: var(--paper); }
  .chip .c { opacity: .65; margin-left: 4px; font-variant-numeric: tabular-nums; }
  .posts { display: grid; gap: 0; border-top: 1px solid var(--rule); }
  .post { position: relative; border-bottom: 1px solid var(--rule); }
  .post-open { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 22px 110px 22px 0; cursor: pointer; }
  .post-open:hover h3 { color: var(--merah-hi); }
  .post h3 { font: 800 30px/1.05 var(--f-display); text-transform: uppercase; margin: 8px 0 8px; text-wrap: balance; }
  .post p { margin: 0; color: var(--paper-dim); font-size: 16px; max-width: 64ch; }
  .post .del { position: absolute; top: 22px; right: 0; color: var(--paper-dim); }
  @media (max-width: 560px) { .post-open { padding-right: 0; } .post .del { position: static; margin-bottom: 16px; } }

  /* 05 Jejaring */
  .net { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: start; }
  .net > * { min-width: 0; }
  .collab { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
  .collab li { display: flex; gap: 12px; align-items: baseline; font-size: 18px; }
  .collab li::before { content: "✦"; color: var(--merah); }
  .links { display: grid; gap: 0; border-top: 2px solid var(--ink); }
  .link-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--rule-dark); flex-wrap: wrap; }
  .link-row .k { font: 600 14px var(--f-display); letter-spacing: .18em; text-transform: uppercase; color: var(--paper-ink); }
  .link-row .v { font-size: 17px; word-break: break-all; text-align: right; }
  .link-row a.v { color: var(--merah); text-underline-offset: 3px; }
  .copy { font: 600 12px var(--f-display); letter-spacing: .14em; text-transform: uppercase; background: var(--ink); color: var(--paper); border: 0; padding: 4px 10px; margin-left: 10px; cursor: pointer; }
  @media (max-width: 860px) { .net { grid-template-columns: 1fr; gap: 32px; } }

  /* 06 Peluang */
  .opps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 40px; }
  .opp { background: var(--ink-2); border: 1px solid var(--rule); padding: 26px 22px; display: flex; flex-direction: column; gap: 10px; text-align: left; }
  button.opp { cursor: pointer; }
  button.opp:hover { border-color: var(--merah); }
  .opp h3 { font: 800 34px/1 var(--f-display); text-transform: uppercase; margin: 0; }
  .opp p { margin: 0; font-size: 16px; color: var(--paper-dim); }
  .status { display: inline-flex; align-items: center; gap: 8px; font: 600 13px var(--f-display); letter-spacing: .18em; text-transform: uppercase; }
  .status::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--paper-dim); }
  .status.yes { color: var(--merah-hi); }
  .status.yes::before { background: var(--merah-hi); box-shadow: 0 0 0 0 rgba(228,59,79,.6); animation: ping 1.8s infinite; }
  @keyframes ping { 70% { box-shadow: 0 0 0 10px rgba(228,59,79,0); } 100% { box-shadow: 0 0 0 0 rgba(228,59,79,0); } }
  .opp .hint { font-size: 13px; font-style: italic; color: var(--paper-dim); }
  .apply { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: center; border: 1px solid var(--rule); padding: 28px; }
  .apply p { margin: 0; color: var(--paper-dim); max-width: 50ch; }
  .apply h3 { font: 800 30px/1 var(--f-display); text-transform: uppercase; margin: 0 0 8px; }
  @media (max-width: 860px) { .opps { grid-template-columns: 1fr; } .apply { grid-template-columns: 1fr; } }

  footer { border-top: 1px solid var(--rule); padding-block: 28px 96px; font-size: 14px; color: var(--paper-dim); }
  footer .wrap { display: flex; justify-content: space-between; gap: 10px 24px; flex-wrap: wrap; }

  /* Dialog */
  dialog { width: min(720px, calc(100% - 32px)); max-height: calc(100% - 48px); padding: 0; border: 0; background: var(--paper); color: var(--ink); }
  dialog::backdrop { background: rgba(0,0,0,.72); }
  .dlg { padding: 44px clamp(22px, 5vw, 52px) 40px; position: relative; }
  .dlg h3 { font: 800 clamp(30px, 4vw, 40px)/1 var(--f-display); text-transform: uppercase; margin: 12px 0 20px; text-wrap: balance; }
  .dlg .meta { color: var(--paper-ink); }
  .dlg-body p { margin: 0 0 16px; max-width: 64ch; }
  .dlg-link { display: inline-block; margin-top: 8px; color: var(--merah); word-break: break-all; }
  .x { position: absolute; top: 12px; right: 12px; width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(0,0,0,.25); background: transparent; font: 26px/1 var(--f-body); cursor: pointer; color: var(--ink); }
  .form { display: grid; gap: 14px; }
  .form label { display: grid; gap: 6px; font: 600 13px var(--f-display); letter-spacing: .16em; text-transform: uppercase; color: var(--paper-ink); }
  .form input, .form select, .form textarea {
    font: 17px/1.5 var(--f-body); color: var(--ink); background: #fff; border: 1px solid rgba(15,13,11,.3); padding: 10px 12px; width: 100%; border-radius: 0;
    text-transform: none; letter-spacing: 0;
  }
  .form textarea { min-height: 160px; resize: vertical; }
  .form-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 6px; }
  .form-status { font-size: 14px; font-style: italic; color: var(--paper-ink); }
  .form .btn.red { border: 0; }

  /* Penampil PDF */
  dialog.pdf-dlg { width: min(980px, calc(100% - 16px)); height: calc(100% - 24px); max-height: none; background: var(--ink-2); color: var(--paper); }
  dialog.pdf-dlg[open] { display: flex; flex-direction: column; }
  .pdf-head { position: relative; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 14px 64px 12px 18px; border-bottom: 1px solid var(--rule); font: 700 14px var(--f-display); letter-spacing: .14em; text-transform: uppercase; }
  .pdf-info { color: var(--paper-dim); font-weight: 600; }
  .pdf-x { top: 8px; right: 10px; color: var(--paper); border-color: var(--rule); }
  .pdf-body { flex: 1; min-height: 0; overflow: auto; padding: 16px; display: grid; gap: 14px; justify-items: center; align-content: start; background: #2b2621; overscroll-behavior: contain; }
  .pdf-page { width: 100%; max-width: 860px; background: #fff; box-shadow: 0 4px 18px rgba(0,0,0,.4); position: relative; }
  .pdf-page::before { content: attr(data-n); position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font: 800 28px var(--f-display); color: #d9d2c3; }
  .pdf-page canvas { position: relative; display: block; width: 100%; height: auto; }
  .pdf-status { margin: 40px 0; color: var(--paper-dim); font-style: italic; text-align: center; }

  .docs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .card { display: flex; flex-direction: column; }
  .card > .card-open { flex: 1; height: auto; }
  .card .docs { margin: 0; padding: 0 22px 20px; }
  .doc-btn {
    cursor: pointer; background: transparent; color: inherit; border: 1px solid currentColor;
    font: 700 12px var(--f-display); letter-spacing: .14em; text-transform: uppercase; padding: 7px 12px; opacity: .85;
  }
  a.doc-btn { display: inline-block; text-decoration: none; }
  .doc-btn:hover { opacity: 1; background: var(--merah); border-color: var(--merah); color: var(--paper); }

  .more-btn {
    display: block; margin: 26px auto 0; cursor: pointer;
    font: 700 15px var(--f-display); letter-spacing: .16em; text-transform: uppercase;
    background: transparent; color: var(--paper); border: 1px solid var(--paper); padding: 13px 26px;
  }
  .more-btn:hover { background: var(--paper); color: var(--ink); }
  .sec-light .more-btn { color: var(--ink); border-color: var(--ink); }
  .sec-light .more-btn:hover { background: var(--ink); color: var(--paper); }

  .reveal { animation: slidein linear both; animation-timeline: view(); animation-range: entry 0% entry 60%; }
  @keyframes slidein { from { transform: translateY(24px); } to { transform: none; } }

  @media (prefers-reduced-motion: reduce) {
    h1 .w, .portrait, .hero-photo, .music-hint, .reveal, .music.on .eq i, .typer .caret, .status.yes::before { animation: none !important; }
    html { scroll-behavior: auto; }
  }

<section class="sec-light" id="profil">
  <div class="wrap">
    <div class="chapter"><span class="no">01</span><span class="t">Personal Branding</span></div>
    <div class="about">
      <div class="reveal">
        <h2>Akademisi junior, pengkaji budaya dan dialog antariman.</h2>
        <p>Saya Muhammad Khalid Brahmana, kelahiran Palembang yang kini berdomisili di Ponorogo, Jawa Timur. Saya mahasiswa tingkat akhir Program Studi Studi Agama-Agama, Fakultas Ushuluddin, Universitas Darussalam Gontor, dengan IPK 3,83 dan predikat Pujian (Cum Laude), serta alumni KMI Pondok Modern Darussalam Gontor. Saya meraih predikat Mahasiswa Teladan Prodi Studi Agama-Agama berturut-turut sejak semester 4, dan juga lolos seleksi Pemilihan Mahasiswa Berprestasi (Pilmapres) tahap 2 UNIDA Gontor, Tahun Akademik 2024–2025.</p>
        <p>Saya berpengalaman memimpin organisasi kemahasiswaan sebagai Ketua HMP Studi Agama-Agama (2024–2025) dan Ketua Senat Mahasiswa Fakultas Ushuluddin (2025–2026). Saya juga aktif sebagai pemateri dan pembawa acara, serta terbiasa menangani publikasi dan dokumentasi kegiatan kampus.</p>
        <p>Minat keilmuan saya berpusat pada hubungan agama dan budaya serta dialog antarumat beragama, yang saya dalami lewat skripsi tentang pengalaman sakral dalam tradisi Nyadran di Dam Cakaran, Sawoo, Ponorogo.</p>
        <p class="pull">Ilmu untuk dipahami, diamalkan, dan diwariskan.</p>

Studi Agama-Agama UNIDA Gontor","desc":"Atas kontribusi dalam rangkaian SAA Knowledge and Fest 2.0, 22–28 November 2025.","docs":["C.6"]},{"id":"a2026streak","kind":"Prestasi","sort":202609,"year":"2025 – 2026","title":"Mahasiswa Teladan Prodi Studi Agama-Agama — Berturut-turut Sejak Semester 4","org":"Fakultas Ushuluddin, UNIDA Gontor","desc":"Semester 4 (Feb 2025): Highest GPA Achiever (IP 3,72) dan Highest IPKs Achiever (IPKS 3,89). Semester 5 (TA 2025–2026): Mahasiswa Teladan atas capaian IPK dan IPKS terbaik. Semester 7 (TA 2026–2027): Mahasiswa Teladan dengan IPK 3,82 dan IPKS 3,71. Pada semester 6 tidak ada penganugerahan.","docs":["C.3","C.4","C.2","C.1"]},{"id":"a202509antibullying","kind":"Pelatihan","sort":202509,"year":"Sep 2025","title":"Diklat Nasional Anti Perundungan (Anti-Bullying) dan Kekerasan Terhadap Anak","org":"Diklat Online, PT Sumber Belajar Bersama","desc":"Diklat daring 22–25 September 2025, 40 JP (5 materi), hasil evaluasi: Sangat Baik. Sertifikat No. 13.004/DO-DKAK/IX/2025/XD5EC10716.","docs":["C.30"]}],"posts":[{"id":"p202610agnostik","kind":"Artikel","date":"2026-10-10T08:00:00.000Z","title":"Bagaimana Islam Memandang Agnostisisme?","body":"Di tengah derasnya arus informasi, agnostisisme menjadi salah satu pandangan yang semakin dikenal. Agnostisisme mempertanyakan apakah keberadaan Tuhan dapat diketahui secara pasti oleh manusia. Penganutnya tidak selalu menyatakan bahwa Tuhan tidak ada, tetapi memilih bersikap bahwa keberadaan Tuhan belum atau tidak dapat dipastikan.\n\nBagi seorang Muslim, fenomena tersebut perlu dipahami dengan tepat. Islam mengajarkan manusia untuk menggunakan akal dan berpikir, tetapi juga menunjukkan batas kemampuan akal serta pentingnya wahyu sebagai petunjuk. Karena itu, penting untuk memahami agnostisisme sekaligus melihat bagaimana Islam memandangnya.\n\nTulisan lengkap terbit di Buletin Dakwah Edisi 38, Pesantren Darusy Syahadah: darusyahadah.com/bagaimana-islam-memandang-agnostisisme"},{"id":"pb2026080200","kind":"Publikasi Berita","date":"2026-08-02T08:00:00.000Z","title":"Mahasiswa UNIDA Gontor Hadirkan Inovasi Fair Access pada Castle Conference UNJ","link":"https://unida.gontor.ac.id/mahasiswa-unida-gontor-inovasi-hukum-digital/","body":"Liputan partisipasi Muhammad Azrul Amirullah, mahasiswa Perbandingan Madzhab dan Hukum semester 7, dalam Castle Conference 6.0 yang digelar Universitas Negeri Jakarta secara hibrida pada 1 Agustus 2026. Berita ini menyoroti gagasan inovasi Fair Access di bidang hukum digital yang dipresentasikan dalam sesi panel, sekaligus menempatkannya dalam konteks forum ilmiah nasional lintas disiplin.\n\nPeran: Penulis · Editor: Ahmad Ma’ruf Muzaidin Arrosit · Dimuat di website resmi UNIDA Gontor, 2 Agustus 2026."},{"id":"pb2026072801","kind":"Publikasi Berita","date":"2026-07-28T08:00:00.000Z","title":"SAA Sapa Guru UNIDA Gontor Tanamkan Makna Niat dan Hikmah dalam Khidmah","link":"https://unida.gontor.ac.id/saa-sapa-guru-unida-gontor-tanamkan-hikmah-khidmah/","body":"Laporan kegiatan SAA Sapa Guru Prodi Studi Agama-Agama pada 27 Juli 2026 di Kantor Senat UNIDA Gontor. Berita ini merangkum pembinaan dari KH. Assoc. Prof. Dr. Ahmad Hidayatullah Zarkasyi, M.A. bertajuk “Telaah Niat; Menggali Hikmah di Tengah Khidmah”, yang menekankan niat sebagai dasar setiap amal dan pengabdian mahasiswa.\n\nPeran: Penulis · Editor: Ahmad Ma’ruf Muzaidin Arrosit · Dimuat di website resmi UNIDA Gontor, 28 Juli 2026."},{"id":"pb2026070902","kind":"Publikasi Berita","date":"2026-07-09T08:00:00.000Z","title":"Tabligh Akbar UNIDA Gontor Tegaskan Peran Pesantren dalam Membangun Peradaban Islam","link":"https://unida.gontor.ac.id/tabligh-akbar-unida-gontor-peran-pesantren/","body":"Liputan Tabligh Akbar bersama Ustadz Dr. (H.C.) Adi Hidayat, Lc., M.A. pada 9 Juli 2026, bagian dari Milad ke-63 UNIDA Gontor dan peringatan 100 Tahun Gontor, yang dihadiri ribuan santri, mahasiswa, alumni, dan masyarakat. Berita ini mengangkat pesan tentang pesantren sebagai fondasi peradaban Islam serta sambutan Rektor tentang perjalanan satu abad Gontor.\n\nPeran: Penulis · Editor: Ahmad Ma’ruf Muzaidin Arrosit · Dimuat di website resmi UNIDA Gontor, 9 Juli 2026."},{"id":"pb2026070903","kind":"Publikasi Berita","date":"2026-07-09T08:00:00.000Z","title":"UNIDA Gontor Perkuat Literasi Keuangan Syariah untuk Mencetak Generasi Finansial Berintegritas","link":"https://unida.gontor.ac.id/unida-gontor-perkuat-literasi-keuangan-syariah/","body":"Liputan Seminar Nasional “Penguatan Literasi Keuangan dan Investasi Syariah untuk Mendukung Pertumbuhan Ekonomi Nasional” pada 9 Juli 2026 dalam rangkaian Milad ke-63 UNIDA Gontor. Berita ini menyoroti peringatan Rektor tentang maraknya penipuan dan investasi ilegal di era digital, serta pentingnya literasi keuangan syariah bagi sivitas akademika.\n\nPeran: Penulis (bersama Fatih Atha Ananda Diostri) · Editor: Ahmad Ma’ruf Muzaidin Arrosit · Dimuat di website resmi UNIDA Gontor, 9 Juli 2026."},{"id":"pb2026070704","kind":"Publikasi Berita","date":"2026-07-07T08:00:00.000Z","title":"UNIDA Bersholawat Bersama Dzikrussalam Memperkuat Spiritualitas Milad UNIDA Gontor","link":"https://unida.gontor.ac.id/unida-bersholawat-dzikrussalam-milad-unida-gontor/","body":"Laporan malam UNIDA Bersholawat bersama Majelis Dzikrussalam pada 7 Juli 2026 di lapangan depan Gedung Terpadu, yang dihadiri pimpinan universitas, dosen, mahasiswa, alumni, dan masyarakat. Berita ini merangkum tausiyah dua penceramah tentang kecintaan kepada Rasulullah dan peran shalawat dalam menguatkan ukhuwah di lingkungan kampus.\n\nPeran: Penulis · Editor: Ahmad Ma’ruf Muzaidin Arrosit · Dimuat di website resmi UNIDA Gontor, 7 Juli 2026."},{"id":"pb2026070705","kind":"Publikasi Berita","date":"2026-07-07T08:00:00.000Z","title":"MCU Gratis Lengkap Meriahkan Milad UNIDA Gontor dengan Layanan Kesehatan Berkualitas","link":"https://unida.gontor.ac.id/mcu-gratis-milad-unida-gontor-2026/","body":"Liputan Medical Check Up gratis pada 7 Juli 2026 di Lobby Gedung Terpadu dalam rangkaian Milad UNIDA Gontor. Berita ini menjelaskan kerja sama Fakultas Kedokteran UNIDA Gontor, PMI, Klinik Asy Syifa, Darussalam Medical Center, dan Oska Kacamata yang menghadirkan layanan pemeriksaan kesehatan lebih lengkap bagi sivitas akademika dan masyarakat.\n\nPeran: Penulis · Editor: Ahmad Ma’ruf Muzaidin Arrosit · Dimuat di website resmi UNIDA Gontor, 7 Juli 2026."},{"id":"pb2026070606","kind":"Publikasi Berita","date":"2026-07-06T08:00:00.000Z","title":"UKM Thibbun Nabawi Gelar Pelatihan Bekam Edukatif Tingkatkan Kompetensi Mahasiswa UNIDA Gontor","link":"https://unida.gontor.ac.id/pelatihan-bekam-thibbun-nabawi-unida-gontor/","body":"Laporan Pelatihan dan Pengenalan Bekam yang diselenggarakan UKM Thibbun Nabawi pada 3 Juli 2026 di Mini Hall Siroh, bagian dari rangkaian 100 Tahun Gontor dan Milad ke-63 UNIDA Gontor. Berita ini mengulas materi dari Ketua Persatuan Bekam Indonesia Cabang Ponorogo dan antusiasme mahasiswa mempelajari kesehatan berbasis nilai Islam.\n\nPeran: Penulis · Editor: Ahmad Ma’ruf Muzaidin Arrosit · Dimuat di website resmi UNIDA Gontor, 6 Juli 2026."},{"id":"pb2026053107","kind":"Publikasi Berita","date":"2026-05-31T08:00:00.000Z","title":"Nilai Kearifan Qurban Ditekankan dalam Kajian Ahad Pagi UNIDA Gontor 2026","link":"https://unida.gontor.ac.id/kearifan-qurban-unida-gontor-2026/","body":"Liputan Kajian Ahad Pagi ke-131 di Masjid Jami’ UNIDA Gontor pada 31 Mei 2026 bersama Dr. Eko Nurcahyo, M.A., Ph.D., bertema “Nilai-Nilai Kearifan dalam Ibadah Qurban”, yang diikuti 132 jamaah. Berita ini merangkum pesan bahwa qurban adalah simbol pengorbanan yang lebih luas: pengendalian diri, pengorbanan waktu, dan kesungguhan menaati perintah Allah.\n\nPeran: Penulis · Editor: Ahmad Ma’ruf Muzaidin Arrosit · Dimuat di website resmi UNIDA Gontor, 31 Mei 2026."},{"id":"pb2026052708","kind":"Publikasi Berita","date":"2026-05-27T08:00:00.000Z","title":"Semangat Kebersamaan Warnai Pelaksanaan Qurban UNIDA Gontor Penuh Keberkahan","link":"https://unida.gontor.ac.id/qurban-unida-gontor-2026/","body":"Laporan pelaksanaan qurban Idul Adha 1447 H pada 27 Mei 2026 di UNIDA Gontor, dengan 13 ekor sapi dan 50 ekor kambing. Berita ini menggambarkan gotong royong dosen, tenaga kependidikan, dan mahasiswa dari penyembelihan hingga distribusi daging kepada masyarakat, sebagai cerminan karakter pendidikan pesantren.\n\nPeran: Penulis · Editor: Ahmad Ma’ruf Muzaidin Arrosit · Dimuat di website resmi UNIDA Gontor, 27 Mei 2026."},{"id":"pb2026051709","kind":"Publikasi Berita","date":"2026-05-17T08:00:00.000Z","title":"Khutbatu-l-‘Arsy UNIDA Gontor 2026 Teguhkan Langkah Menuju Satu Abad","link":"https://unida.gontor.ac.id/khutbatu-arsy-unida-gontor-2026/","body":"Liputan Apel Tahunan Pekan Perkenalan Khutbatu-l-‘Arsy 1447 H pada 17 Mei 2026 di depan Gedung Terpadu, yang diikuti ribuan mahasiswa dan dosen. Berita ini menyoroti kedisiplinan peserta dan formasi pengibar bendera bertema One Century sebagai simbol perjalanan satu abad Gontor dalam pendidikan dan kaderisasi.\n\nPeran: Penulis · Editor: Ahmad Ma’ruf Muzaidin Arrosit · Dimuat di website resmi UNIDA Gontor, 17 Mei 2026."},{"id":"pb2026050710","kind":"Publikasi Berita","date":"2026-05-07T08:00:00.000Z","title":"UNIDA Gontor Gelar Seminar Internasional Dakwah dan Pembangunan Manusia","link":"https://unida.gontor.ac.id/seminar-internasional-unida-gontor-dakwah-human-development/","body":"Liputan seminar internasional “Islamic Dawah and Human Development in a Changing World” pada 7 Mei 2026 di Hall CIOS UNIDA Gontor. Berita ini merangkum gagasan bahwa dakwah Islam harus menjadi fondasi pembangunan manusia dan mampu menghadirkan solusi nyata atas tantangan sosial di tengah dinamika global.\n\nPeran: Penulis · Editor: Ahmad Ma’ruf Muzaidin Arrosit · Dimuat di website resmi UNIDA Gontor, 7 Mei 2026."},{"id":"pb2026022711","kind":"Publikasi Berita","date":"2026-02-27T08:00:00.000Z","title":"KKN 38 UNIDA Gontor Dampingi Ramadhan Camp 3.0 bagi Pelajar Siman Jetis","link":"https://unida.gontor.ac.id/ramadhan-camp-3-unida-gontor-siman-jetis/","body":"Laporan Ramadhan Camp 3.0 pada 23–25 Februari 2026 bagi siswa SMPN 1 Siman dan SMPN 2 Jetis, dengan pembinaan berbasis asrama selama tiga hari dua malam. Berita ini menyoroti peran mahasiswa KKN Tematik Angkatan 38 sebagai pengajar dan pendamping, mulai dari materi Fiqh Shiyam, pre-test, hingga kegiatan belajar bertahap.\n\nPeran: Redaksi · Editor: Ahmad Ma’ruf Muzaidin Arrosit · Dimuat di website resmi UNIDA Gontor, 27 Februari 2026."},{"id":"pb2026022612","kind":"Publikasi Berita","date":"2026-02-26T08:00:00.000Z","title":"Ramadhan Camp UNIDA Gontor Bentuk Karakter Spiritual dan Akademik Siswa SMP Negeri 4 Ponorogo","link":"https://unida.gontor.ac.id/ramadhan-camp-3-unida-gontor-smpn-4-ponorogo/","body":"Liputan Ramadhan Camp 3.0 Gelombang 1 bagi siswa SMP Negeri 4 Ponorogo di kampus UNIDA Gontor. Berita ini menjelaskan program pembinaan berbasis asrama yang memadukan penguatan spiritual, akademik, dan karakter, dimulai dengan materi Fiqh Shiyam di Masjid UNIDA Gontor dan pembelajaran berjenjang.\n\nPeran: Redaksi · Editor: Ahmad Ma’ruf Muzaidin Arrosit · Dimuat di website resmi UNIDA Gontor, 26 Februari 2026."},{"id":"pb2026022613","kind":"Publikasi Berita","date":"2026-02-26T08:00:00.000Z","title":"Maidaturrahman UNIDA Gontor Perkuat Ukhuwah Ramadhan Lewat Buka Puasa Bersama","link":"https://unida.gontor.ac.id/maidaturrahman-unida-gontor/","body":"Laporan tradisi buka puasa bersama Maidaturrahman di teras Masjid UNIDA Gontor, dengan sorotan pada pelaksanaan 20 Februari 2026 yang terbuka bagi mahasiswa, peserta Ramadhan Camp, dan masyarakat. Berita ini mengulas inspirasi konsepnya dari tradisi ifthar di Kairo dan pelayanan umat Masjid Jogokariyan.\n\nPeran: Redaksi · Editor: Ahmad Ma’ruf Muzaidin Arrosit · Dimuat di website resmi UNIDA Gontor, 26 Februari 2026."},{"id":"pb2026011314","kind":"Publikasi Berita","date":"2026-01-13T08:00:00.000Z","title":"BPM UNIDA Gontor Menyelenggarakan Pelatihan Auditor AMI Batch IV","link":"https://unida.gontor.ac.id/pelatihan-auditor-ami-batch-iv-unida-gontor/","body":"Liputan Pelatihan Auditor Audit Mutu Internal Batch IV oleh Badan Penjaminan Mutu UNIDA Gontor pada 29–31 Desember 2025, yang diikuti 32 peserta dari perguruan tinggi mitra di Madura, Kediri, Yogyakarta, dan Malang. Berita ini menempatkan UNIDA Gontor sebagai rujukan pengembangan Sistem Penjaminan Mutu Internal.\n\nPeran: Redaksi · Editor: Ahmad Ma’ruf Muzaidin Arrosit · Dimuat di website resmi UNIDA Gontor, 13 Januari 2026."},{"id":"pb2025122715","kind":"Publikasi Berita","date":"2025-12-27T08:00:00.000Z","title":"UNIDA Gontor Menyelenggarakan Ujian Terbuka Hafalan Al-Qur’an Penutup Program 2025","link":"https://unida.gontor.ac.id/ujian-terbuka-hafalan-alquran-unida-gontor-2025/","body":"Laporan Ujian Terbuka Hafalan Al-Qur’an pada 25 Desember 2025 di Auditorium Gedung Utama, sebagai penutup program Zona Al-Qur’an selama setahun. Berita ini merangkum kehadiran Presiden universitas dan jajaran rektorat serta laporan capaian program dari Markaz Al-Qur’an.\n\nPeran: Redaksi · Editor: Ahmad Ma’ruf Muzaidin Arrosit · Dimuat di website resmi UNIDA Gontor, 27 Desember 2025."},{"id":"pb2025121816","kind":"Publikasi Berita","date":"2025-12-18T08:00:00.000Z","title":"Design Kebijakan Strategis Pembelajaran Bahasa Arab untuk Non Native","link":"https://unida.gontor.ac.id/muktamar-internasional-bahasa-arab-unida-gontor/","body":"Liputan Muktamar Internasional Bahasa Arab pada 18 Desember 2025 dalam rangka 100 Tahun Gontor dan Hari Bahasa Arab Sedunia. Berita ini merangkum rumusan kebijakan pembelajaran bahasa Arab bagi penutur non-native: kurikulum berbasis kompetensi, standar capaian, pelatihan pengajar, ekosistem bahasa, dan kemitraan lintas lembaga.\n\nPeran: Redaksi · Editor: Ahmad Ma’ruf Muzaidin Arrosit · Dimuat di website resmi UNIDA Gontor, 18 Desember 2025."},{"id":"pb2025020617","kind":"Publikasi Berita","date":"2025-02-06T08:00:00.000Z","title":"Gema Prestasi di UNIDA Gontor Choice Award 2025","link":"https://unida.gontor.ac.id/gema-prestasi-di-unida-gontor-choice-award-2025/","body":"Liputan UNIDA Choice Award (UCA) 2025 pada 5 Februari 2025, ajang apresiasi prestasi mahasiswa UNIDA Gontor. Berita ini merangkum sambutan panitia tentang cita-cita menjadi World-Class University dan pesan motivasi Assoc. Prof. Dr. Khoirul Umam, M.Ec. bahwa setiap tantangan adalah batu loncatan.\n\nPeran: Redaksi · Editor: Rifki Aulia · Dimuat di website resmi UNIDA Gontor, 6 Februari 2025."},{"id":"pb2025020418","kind":"Publikasi Berita","date":"2025-02-04T08:00:00.000Z","title":"Joyful Festival: Ajang Kreativitas dan Ketangguhan di UNIDA Gontor","link":"https://unida.gontor.ac.id/joyful-festival-unida-gontor-2025/","body":"Laporan Joyful Festival “Siap Tangguh Berprestasi” pada 3 Februari 2025 di Lobby Gedung Utama UNIDA Gontor, yang dibuka Dr. Khasib Amrullah, M.Ud. Berita ini menggambarkan rangkaian penampilan musik dan puisi mahasiswa serta pesan tentang melawan rasa malas lewat kreativitas.\n\nPeran: Redaksi · Editor: Rifki Aulia · Dimuat di website resmi UNIDA Gontor, 4 Februari 2025."},{"id":"pb2024123019","kind":"Publikasi Berita","date":"2024-12-30T08:00:00.000Z","title":"Wisuda Ke-44 UNIDA Gontor: Melahirkan Generasi Unggul Berjiwa Ikhlas dan Berintegritas","link":"https://unida.gontor.ac.id/wisuda-ke-44-unida-gontor-melahirkan-generasi-unggul-berjiwa-ikhlas-dan-berintegritas/","body":"Liputan prosesi Wisuda ke-44 UNIDA Gontor pada 29 Desember 2024. Berita ini menyoroti pesan Rektor Prof. Dr. K.H. Hamid Fahmy Zarkasyi tentang sistem asrama yang mengacu pada universitas terkemuka dunia, serta pembentukan keikhlasan, kerja sama, dan nilai Panca Jiwa di luar ruang kelas.\n\nPeran: Redaksi · Editor: Rifki Aulia · Dimuat di website resmi UNIDA Gontor, 30 Desember 2024."}],"contact":{"email":"muhkhabrahmana@gmail.com","phone":"0813-7926-0838","instagram":"https://www.instagram.com/muhkha_","scholar":"https://scholar.google.co.id/citations?user=ukHPHUAAAAAJ&hl=id"},"open":{"kerja":true,"magang":false,"beasiswa":true}}</script>
<script id="main">
(function () {
  var PAGE_TITLE = 'Muhammad Khalid Brahmana';
  var RESET = ':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
  function src(id) { return document.getElementById(id).textContent; }
  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function isUrl(u) { return /^https?:\/\/[^\s]+$/i.test(u || ''); }
  function uid(p) { return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function excerpt(t, n) { t = String(t || '').replace(/\s+/g, ' ').trim(); return t.length > n ? t.slice(0, n).replace(/\s+\S*$/, '') + '…' : t; }
  function fmtDate(iso) { var d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  $('app').innerHTML = src('markup');
  var S = {};
  try { S = JSON.parse(src('state')) || {}; } catch (e) {}
  ['research', 'activities', 'posts'].forEach(function (k) { if (!Array.isArray(S[k])) S[k] = []; });
  if (!S.contact || typeof S.contact !== 'object') S.contact = {};
  if (!S.open || typeof S.open !== 'object') S.open = { kerja: true, magang: true, beasiswa: true };

  var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var canWrite = false, cap = null;

  // ---------- Animasi hero: kisi bintang delapan ----------
  var cv = $('stars'), cx = cv.getContext('2d');
  function star(x, y, r, a) {
    for (var k = 0; k < 2; k++) {
      cx.beginPath();
      for (var i = 0; i < 4; i++) {
        var t = a + k * Math.PI / 4 + i * Math.PI / 2;
        cx[i ? 'lineTo' : 'moveTo'](x + r * Math.cos(t), y + r * Math.sin(t));
      }
      cx.closePath(); cx.stroke();
    }
  }
  function drawStars(t) {
    var dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
    if (!w) return;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    cx.setTransform(dpr, 0, 0, dpr, 0, 0); cx.clearRect(0, 0, w, h);
    var cell = 86, a = t / 9000, cols = Math.ceil(w / cell) + 1, rows = Math.ceil(h / cell) + 1;
    for (var i = 0; i < cols; i++) for (var j = 0; j < rows; j++) {
      var x = i * cell + (j % 2 ? cell / 2 : 0), y = j * cell;
      var pulse = Math.sin(t / 1400 + i * .7 + j * 1.3);
      var red = (i * 7 + j * 3) % 11 === 0;
      cx.lineWidth = red ? 1.6 : 1;
      cx.strokeStyle = red ? 'rgba(228,59,79,' + (0.35 + 0.35 * pulse) + ')' : 'rgba(239,230,210,' + (0.10 + 0.05 * pulse) + ')';
      star(x, y, cell * (red ? .3 : .26), (i + j) % 2 ? a : -a);
    }
  }
  function loop(t) { drawStars(t); requestAnimationFrame(loop); }
  if (still) { drawStars(0); addEventListener('resize', function () { drawStars(0); }); } else requestAnimationFrame(loop);

  // ---------- Teks berganti seperti mesin ketik ----------
  var roles = ['Akademisi Junior', 'Ketua SEMA Fakultas Ushuluddin', 'Pemateri & Pembawa Acara', 'Technical Writer', 'Fotografer', 'Muhafizh Mahasiswa UNIDA Gontor'];
  var typer = $('typer');
  if (!still) (function () {
    var ri = 0, ci = roles[0].length, del = true;
    function tickType() {
      var word = roles[ri];
      if (del) { ci--; if (ci <= 0) { del = false; ri = (ri + 1) % roles.length; } }
      else { ci++; if (ci >= roles[ri].length) { del = true; typer.textContent = roles[ri]; return setTimeout(tickType, 1900); } }
      typer.textContent = roles[ri].slice(0, Math.max(ci, 0));
      setTimeout(tickType, del ? 45 : 85);
    }
    setTimeout(tickType, 2200);
  })();

  // ---------- Notifikasi kecil ----------
  var toastT;
  function toast(msg) { var t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(function () { t.hidden = true; }, 5000); }

  // ---------- Tombol hapus dua langkah ----------
  function delButton(onConfirm) {
    var b = el('button', 'del', 'Hapus'); b.type = 'button';
    b.addEventListener('click', function (e) {
      e.stopPropagation();
      if (!b.classList.contains('armed')) {
        b.classList.add('armed'); b.textContent = 'Yakin? Klik lagi';
        setTimeout(function () { b.classList.remove('armed'); b.textContent = 'Hapus'; }, 4000);
        return;
      }
      b.disabled = true; b.textContent = 'Menghapus…';
      onConfirm().catch(function () { b.disabled = false; b.classList.remove('armed'); b.textContent = 'Hapus'; });
    });
    return b;
  }

  // ---------- Pembaca ----------
  function openReader(meta, title, body, link) {
    var m = $('readerMeta'); m.textContent = '';
    meta.forEach(function (x, i) { m.appendChild(el('span', i === 0 ? 'badge' : '', x)); });
    $('readerTitle').textContent = title;
    var b = $('readerBody'); b.textContent = '';
    String(body || '').split(/\n\s*\n/).forEach(function (p) { if (p.trim()) b.appendChild(el('p', '', p.trim())); });
    if (isUrl(link)) { var a = el('a', 'dlg-link', 'Buka tautan →'); a.href = link; a.target = '_blank'; a.rel = 'noopener'; b.appendChild(a); }
    $('reader').showModal();
  }
  document.querySelectorAll('dialog').forEach(function (d) {
    d.addEventListener('click', function (e) { if (e.target === d || e.target.hasAttribute('data-close')) d.close(); });
  });

  // ---------- Render ----------
  var postFilter = 'Semua', actFilter = 'Semua', actOpen = false, postOpen = false;
  var ACT_LIMIT = 3, POST_LIMIT = 3;
  var KINDS = [['Pendidikan', 'Pendidikan'], ['Prestasi', 'Prestasi & Penghargaan'], ['Organisasi', 'Organisasi'],
               ['Pemateri', 'Pemateri, Narasumber & MC'], ['Kepanitiaan', 'Kepanitiaan'], ['Pelatihan', 'Pelatihan & Seminar'], ['Lainnya', 'Lainnya']];
  var MONTHS = ['jan', 'feb', 'mar', 'apr', 'mei', 'jun', 'jul', 'agu', 'sep', 'okt', 'nov', 'des'];
  // Kunci urutan: angka 'sort' bila ada, jika tidak tahun terakhir (dan bulan) dari teks tahun
  function akey(a) {
    if (a.sort) return +a.sort;
    var y = String(a.year || '').match(/(19|20)\d\d/g);
    if (!y) return 0;
    var m = String(a.year).toLowerCase().match(/(jan|feb|mar|apr|mei|jun|jul|agu|sep|okt|nov|des)/);
    return +y[y.length - 1] * 100 + (m ? MONTHS.indexOf(m[1]) + 1 : (/sekarang|kini/i.test(a.year) ? 99 : 50));
  }
  function render() {
    $('nPrestasi').textContent = S.activities.filter(function (a) { return a.kind === 'Prestasi'; }).length;
    $('nResearch').textContent = S.research.length;
    $('nBerita').textContent = S.posts.filter(function (p) { return p.kind === 'Publikasi Berita'; }).length;
    $('nActs').textContent = S.activities.filter(function (a) { return /^(Organisasi|Pemateri|Kepanitiaan)$/.test(a.kind); }).length;

    // Portofolio
    var rl = $('researchList'); rl.textContent = '';
    S.research.slice().sort(function (a, b) { return akey(b) - akey(a); }).forEach(function (r) {
      var card = el('article', 'card');
      var open = el('button', 'card-open'); open.type = 'button';
      var meta = el('div', 'meta'); meta.appendChild(el('span', 'badge', r.kind)); meta.appendChild(el('span', '', r.year));
      open.appendChild(meta); open.appendChild(el('h3', '', r.title)); open.appendChild(el('p', '', excerpt(r.desc, 140)));
      open.appendChild(el('span', 'more', 'Rincian →'));
      open.addEventListener('click', function () { openReader([r.kind, r.year], r.title, r.desc || 'Belum ada deskripsi.', r.link); });
      card.appendChild(open);
      docButtons(card, r.docs);
      if (canWrite) card.appendChild(delButton(function () { return save(withList('research', S.research.filter(function (x) { return x.id !== r.id; }))); }));
      rl.appendChild(card);
    });
    $('researchEmpty').hidden = S.research.length > 0;
    $('researchEmpty').textContent = canWrite ? 'Belum ada karya. Klik “+ Tambah karya” untuk mengisi portofolio Anda.' : 'Portofolio akademik sedang disusun.';

    // Aktivitas, dikelompokkan per kategori
    var af = $('actFilters'); af.textContent = '';
    var present = KINDS.filter(function (k) { return S.activities.some(function (a) { return (a.kind || 'Lainnya') === k[0]; }); });
    [['Semua', 'Semua']].concat(present).forEach(function (k) {
      var n = k[0] === 'Semua' ? S.activities.length : S.activities.filter(function (a) { return (a.kind || 'Lainnya') === k[0]; }).length;
      var b = el('button', 'chip' + (actFilter === k[0] ? ' on' : ''), k[1]); b.type = 'button';
      b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', actFilter === k[0] ? 'true' : 'false');
      b.appendChild(el('span', 'c', n));
      b.addEventListener('click', function () { actFilter = k[0]; actOpen = false; render(); });
      af.appendChild(b);
    });
    var al = $('actList'); al.textContent = '';
    present.forEach(function (k) {
      if (actFilter !== 'Semua' && actFilter !== k[0]) return;
      var list = S.activities.filter(function (a) { return (a.kind || 'Lainnya') === k[0]; }).sort(function (a, b) { return akey(b) - akey(a); });
      if (actFilter === 'Semua') al.appendChild(el('li', 'tl-group', k[1]));
      list.forEach(function (a) {
        var li = el('li');
        li.appendChild(el('div', 'yr', a.year || '—'));
        var body = el('div'); body.appendChild(el('h3', '', a.title));
        if (a.org) body.appendChild(el('p', 'org', a.org));
        if (a.desc) body.appendChild(el('p', 'desc', a.desc));
        docButtons(body, a.docs, a.link, a.linkLabel);
        li.appendChild(body);
        li.appendChild(canWrite ? delButton(function () { return save(withList('activities', S.activities.filter(function (x) { return x.id !== a.id; }))); }) : el('span'));
        al.appendChild(li);
      });
    });
    $('actEmpty').hidden = S.activities.length > 0;

    // Tulisan
    var pl = $('postList'); pl.textContent = '';
    var posts = S.posts.slice().sort(function (a, b) { return String(b.date).localeCompare(String(a.date)); });
    var shown = posts.filter(function (p) { return postFilter === 'Semua' || p.kind === postFilter; });
    shown.forEach(function (p) {
      var art = el('article', 'post');
      var open = el('button', 'post-open'); open.type = 'button';
      var meta = el('div', 'meta'); meta.appendChild(el('span', 'badge', p.kind)); meta.appendChild(el('span', '', fmtDate(p.date)));
      open.appendChild(meta); open.appendChild(el('h3', '', p.title)); open.appendChild(el('p', '', excerpt(p.body, 200)));
      open.addEventListener('click', function () { openReader([p.kind, fmtDate(p.date)], p.title, p.body, p.link); });
      art.appendChild(open);
      if (canWrite) art.appendChild(delButton(function () { return save(withList('posts', S.posts.filter(function (x) { return x.id !== p.id; }))); }));
      pl.appendChild(art);
    });
    ['Semua', 'Opini', 'Artikel', 'Publikasi Berita'].forEach(function (k) {
      $('c' + k.replace(/ /g, '')).textContent = k === 'Semua' ? posts.length : posts.filter(function (p) { return p.kind === k; }).length;
    });
    $('postEmpty').hidden = shown.length > 0;
    $('postEmpty').textContent = !posts.length
      ? (canWrite ? 'Belum ada tulisan. Klik “+ Tulis baru” untuk menerbitkan tulisan pertama Anda.' : 'Belum ada tulisan.')
      : 'Belum ada tulisan di kategori ' + postFilter + '.';

    // Kontak
    var cl = $('contactList'); cl.textContent = '';
    var C = S.contact, rows = 0;
    if (C.email) {
      rows++;
      var r1 = el('div', 'link-row'); r1.appendChild(el('span', 'k', 'Email'));
      var v = el('span', 'v', C.email);
      var cp = el('button', 'copy', 'Salin'); cp.type = 'button';
      cp.addEventListener('click', function () {
        var done = function () { cp.textContent = 'Tersalin'; setTimeout(function () { cp.textContent = 'Salin'; }, 2000); };
        var fallback = function () { var rg = document.createRange(); rg.selectNodeContents(v); var s = getSelection(); s.removeAllRanges(); s.addRange(rg); cp.textContent = 'Tekan Ctrl+C'; };
        try { navigator.clipboard.writeText(C.email).then(done, fallback); } catch (e) { fallback(); }
      });
      var wrapV = el('span'); wrapV.appendChild(v); wrapV.appendChild(cp);
      r1.appendChild(wrapV); cl.appendChild(r1);
    }
    var waNum = String(C.phone || '').replace(/\D/g, '').replace(/^0/, '62');
    if (waNum.length >= 9) {
      rows++;
      var r2 = el('div', 'link-row'); r2.appendChild(el('span', 'k', 'WhatsApp'));
      var pv = el('span', 'v', C.phone);
      var pc = el('button', 'copy', 'Salin'); pc.type = 'button';
      pc.addEventListener('click', function () {
        var done = function () { pc.textContent = 'Tersalin'; setTimeout(function () { pc.textContent = 'Salin'; }, 2000); };
        var fallback = function () { var rg = document.createRange(); rg.selectNodeContents(pv); var s = getSelection(); s.removeAllRanges(); s.addRange(rg); pc.textContent = 'Tekan Ctrl+C'; };
        try { navigator.clipboard.writeText(C.phone).then(done, fallback); } catch (e) { fallback(); }
      });
      var wa = el('a', 'copy', 'Chat'); wa.href = 'https://wa.me/' + waNum; wa.target = '_blank'; wa.rel = 'noopener'; wa.style.textDecoration = 'none';
      var wrapP = el('span'); wrapP.appendChild(pv); wrapP.appendChild(pc); wrapP.appendChild(wa);
      r2.appendChild(wrapP); cl.appendChild(r2);
    }
    [['linkedin', 'LinkedIn'], ['instagram', 'Instagram'], ['scholar', 'Google Scholar / ORCID']].forEach(function (f) {
      if (!isUrl(C[f[0]])) return;
      rows++;
      var r = el('div', 'link-row'); r.appendChild(el('span', 'k', f[1]));
      var a = el('a', 'v', f[0] === 'scholar' ? 'Lihat profil →' : C[f[0]].replace(/^https?:\/\/(www\.)?/i, '').replace(/\/$/, ''));
      a.href = C[f[0]]; a.target = '_blank'; a.rel = 'noopener';
      r.appendChild(a); cl.appendChild(r);
    });
    $('contactEmpty').hidden = rows > 0;
    $('contactEmpty').textContent = canWrite ? 'Belum ada kontak. Klik “Ubah kontak” untuk menambahkan email dan profil Anda.' : 'Kontak akan segera ditambahkan.';

    // Peluang
    var op = $('opps'); op.textContent = '';
    [['kerja', 'Pekerjaan', 'Posisi di bidang penelitian, pendidikan, lembaga keagamaan, atau organisasi kemasyarakatan.'],
     ['magang', 'Internship', 'Magang di lembaga riset, organisasi lintas iman, media, atau lembaga kebudayaan.'],
     ['beasiswa', 'Beasiswa', 'Beasiswa studi, riset, pertukaran pelajar, dan program pengembangan akademik.']].forEach(function (o) {
      var on = !!S.open[o[0]];
      var c = el(canWrite ? 'button' : 'div', 'opp reveal');
      if (canWrite) { c.type = 'button'; c.setAttribute('aria-pressed', on ? 'true' : 'false'); }
      c.appendChild(el('span', 'status' + (on ? ' yes' : ''), on ? 'Terbuka' : 'Tidak sedang mencari'));
      c.appendChild(el('h3', '', o[1]));
      c.appendChild(el('p', '', o[2]));
      if (canWrite) {
        c.appendChild(el('span', 'hint', 'Klik untuk ' + (on ? 'menutup' : 'membuka') + ' status ini'));
        c.addEventListener('click', function () {
          var next = clone(S); next.open[o[0]] = !on;
          c.disabled = true; toast('Menyimpan status…');
          save(next).catch(function () { c.disabled = false; });
        });
      }
      op.appendChild(c);
    });

    applyLimit($('actList'), actOpen, ACT_LIMIT, $('actMore'), 'aktivitas');
    applyLimit($('postList'), postOpen, POST_LIMIT, $('postMore'), 'tulisan');

    document.querySelectorAll('.owner-only').forEach(function (e) { e.hidden = !canWrite; });
    $('ownerBar').hidden = !canWrite;
  }

  // Hanya beberapa entri teratas yang tampil; sisanya dibuka dengan tombol.
  function applyLimit(list, open, limit, btn, noun) {
